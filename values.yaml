# DISABLED (2026-11-15) - ClickHouse has been decommissioned from the Proxmox K3s cluster.
# When false, every ClickHouse resource in this chart renders nothing; the operator dependency is
# still installed so it can remove the ClickHouseInstallation/KeeperInstallation cleanly.
# See README.md "Disabling / Decommissioning" before setting this back to true.
enabled: false

clickhouseCluster:
  shardsCount: 1
  replicasCount: 1
  storageClassName: "local-path-mnt-data" # Storage class for ClickHouse data volumes
  dataStorage: 60Gi # Size of data volume
  logStorage: 5Gi # Size of log volume

clickhouseKeeper:
  storageClassName: "local-path-mnt-data" # Storage class for ClickHouse Keeper volumes
  storage: 5Gi # Size of ClickHouse Keeper volume

# ClickHouse Operator configuration
# Note: Name is use for service account naming
altinity-clickhouse-operator:
  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  dashboards:
    enabled: true # Enable Grafana dashboards for ClickHouse Operator

grafanaClickhouseDatasource:
  username: "default" # ClickHouse username
  password: "default" # ClickHouse password
  defaultDatabase: "default" # Default database for ClickHouse datasource
  grafanaLabelSelector: "kube-monitoring" # Label selector for Grafana datasource
  port: 9000 # Port for ClickHouse native protocol
  httpPort: 8123 # Port for ClickHouse HTTP interface

clickhouseSQLConfigMap:
  initSQL: "init-scripts/hello-schema.sql"

ingress:
  enabled: true # Enable Ingress resource
  host: clickhouse.192-168-86-10.sslip.io

tcpLoadBalancer:
  enabled: true # Enable TCP LoadBalancer service
  targetPort: 9000 # Port for ClickHouse native protocol

tlsSecret:
  enabled: true # Enable TLS secret creation
  certs:
    tlsCrt: "certs/tls.crt" # Path to TLS certificate file
    tlsKey: "certs/tls.key" # Path to TLS key file